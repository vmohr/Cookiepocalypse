<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cookiepocalypse Planner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%22-46%20-60%2084%2092%22%3E%3Cg%20transform%3D%22rotate%28-38%29%22%3E%0A%3Cpath%20d%3D%22M0%20-62%20C9%20-34%2022%20-14%2019%206%20A19%2019%200%200%201%20-19%206%20C-22%20-14%20-9%20-34%200%20-62Z%22%20fill%3D%22%23c4262e%22/%3E%0A%3Cpath%20d%3D%22M0%20-44%20C6%20-24%2014%20-10%2012%204%20A12%2012%200%200%201%20-12%204%20C-14%20-10%20-6%20-24%200%20-44Z%22%20fill%3D%22%23f2a03d%22/%3E%0A%3Ccircle%20cx%3D%220%22%20cy%3D%228%22%20r%3D%2216%22%20fill%3D%22%23e9b35f%22%20stroke%3D%22%23a8702a%22%20stroke-width%3D%221.5%22/%3E%0A%3Ccircle%20cx%3D%22-6%22%20cy%3D%224%22%20r%3D%222.3%22%20fill%3D%22%234a2c17%22/%3E%3Ccircle%20cx%3D%225%22%20cy%3D%2212%22%20r%3D%222.3%22%20fill%3D%22%234a2c17%22/%3E%3Ccircle%20cx%3D%22-3%22%20cy%3D%2216%22%20r%3D%221.9%22%20fill%3D%22%234a2c17%22/%3E%3Ccircle%20cx%3D%227%22%20cy%3D%222%22%20r%3D%221.7%22%20fill%3D%22%234a2c17%22/%3E%3Ccircle%20cx%3D%22-10%22%20cy%3D%2212%22%20r%3D%221.5%22%20fill%3D%22%234a2c17%22/%3E%0A%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f1e8; --paper:#fffdf9; --ink:#2b2420; --muted:#7a6d63; --line:#e6dccf; --line2:#d6c8b6;
  --red:#c4262e; --red-soft:#f8dedb; --green:#1f5c40; --green-soft:#dcebe2; --gold:#b9852f; --gold-soft:#f6ebd3;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 4px 14px rgba(60,40,20,.05);
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Oswald,'Arial Narrow',sans-serif;font-weight:600;margin:0;letter-spacing:.01em;text-transform:uppercase}
a{color:var(--red)}
button,input,select,textarea{font:inherit;color:inherit}
header.top{display:flex;align-items:center;gap:16px;padding:18px 24px 0;flex-wrap:wrap}
header.top .logo{width:300px;max-width:62vw;display:block}
header.top .logo svg{width:100%;height:auto;display:block}
header.top .sub{font:500 13px Oswald,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--green);margin-top:2px}
.status{margin-left:auto;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line2)}
.dot.ok{background:var(--green)}.dot.busy{background:var(--gold)}.dot.err{background:var(--red)}
nav.tabs{display:flex;gap:2px;padding:14px 24px 0;border-bottom:1px solid var(--line2);overflow-x:auto;position:sticky;top:0;background:var(--bg);z-index:5}
nav.tabs a{padding:9px 14px;text-decoration:none;color:var(--muted);font-weight:500;border-radius:8px 8px 0 0;white-space:nowrap;border:1px solid transparent;border-bottom:none;margin-bottom:-1px}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a.on{background:var(--paper);color:var(--red);border-color:var(--line2);box-shadow:inset 0 3px 0 var(--green)}
nav.tabs .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;text-align:center}
main{padding:20px 24px 80px;max-width:1280px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--muted)}.small{font-size:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font:600 26px Oswald,sans-serif}
.stat span{color:var(--muted);font-size:12px}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;background:var(--paper)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.done td{opacity:.45}
tr.done td.nm{text-decoration:line-through}
.tablewrap{overflow-x:auto}
input[type=text],input[type=number],input:not([type]),select,textarea{border:1px solid var(--line2);background:#fff;border-radius:7px;padding:6px 8px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid #e8c9a2;border-color:var(--gold)}
input.num{width:80px;text-align:right}
input.w-s{width:90px}
td input,td select{width:100%}
textarea{width:100%;min-height:90px;resize:vertical}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:#8f2824}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--red)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600;background:var(--line);color:var(--muted)}
.pill.red{background:var(--red-soft);color:var(--red)}.pill.green{background:var(--green-soft);color:var(--green)}.pill.gold{background:var(--gold-soft);color:#8a611c}
.warn{background:var(--gold-soft);border:1px solid #ecd6a8;border-radius:8px;padding:8px 12px;color:#6b4c14;font-size:13px}
.recipes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.rcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.rcard:hover{border-color:var(--gold)}
.rcard h3{font-size:16px;margin-bottom:4px}
.rcard.inplan{border-left:4px solid var(--green)}
.phase-row td{background:#faf5ee;font-weight:600;font-size:12px;color:var(--green);text-transform:uppercase;letter-spacing:.04em}
.sheet-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.sheet-head h2{font-size:20px}
.facts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.derived{color:var(--muted);font-style:italic}
.sess{border-top:1px solid var(--line);padding:10px 0 8px}
.sess:first-child{border-top:none}
.sess-head{display:flex;gap:12px;align-items:baseline}
.sess-n{flex:none;min-width:30px;height:24px;padding:0 7px;border-radius:12px;background:var(--line);color:var(--muted);font:600 13px Oswald,sans-serif;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box}
.sess.next{box-shadow:inset 3px 0 0 var(--green);padding-left:10px}
.sess.next .sess-n{background:var(--green);color:#fff}
.sess.done{opacity:.55}
.sess-buy{margin:4px 0 0 42px;color:#8a611c}
.tasks{list-style:none;margin:6px 0 0 42px;padding:0}
.tasks li{padding:2px 0}
.tasks label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.tasks input{margin-top:3px;flex:none}
.tasks input:checked+span{text-decoration:line-through;color:var(--muted)}
.issue{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.issue:last-child{border-bottom:none}
.sev{width:8px;align-self:stretch;border-radius:4px;flex:none}
.sev.high{background:var(--red)}.sev.med{background:var(--gold)}.sev.low{background:var(--line2)}
.issue .t{font-weight:600}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:860px){.split{grid-template-columns:1fr}main{padding:16px 12px 80px}header.top,nav.tabs{padding-left:12px;padding-right:12px}}
.modal-bg{position:fixed;inset:0;background:rgba(40,25,15,.35);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--paper);border-radius:12px;max-width:560px;width:100%;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:90vh;overflow:auto}
.modal h3{font-size:19px;margin-bottom:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;z-index:60;font-size:13px;box-shadow:var(--shadow)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{border:none;background:#fff;padding:6px 10px;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.drop{border:2px dashed var(--line2);border-radius:var(--r);padding:20px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--gold);background:var(--gold-soft)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kv label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
.kv input{color:var(--ink);font-size:14px}
.handle{cursor:pointer;color:var(--muted);user-select:none}
table.cfe{border-collapse:collapse;width:100%;font-size:13px}
table.cfe td{border:1px solid var(--line2);padding:6px 8px;vertical-align:middle;text-align:left}
table.cfe td.ing{background:#fff;white-space:nowrap}
table.cfe td.ing b{font-variant-numeric:tabular-nums}
table.cfe td.op{background:#fbf6ee;min-width:110px;max-width:260px}
table.cfe td.op.final{background:var(--green-soft);font-weight:600}
table.cfe td.gap{background:#fff;border-left-color:transparent;border-right-color:transparent}
table.cfe td.prep{background:var(--gold-soft);font-size:12px}
table.cfe td.extra{font-style:italic;color:var(--muted)}
textarea.method{font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;min-height:220px;white-space:pre;overflow-x:auto}
</style>
</head>

<script>
// ---- Core calculations (ported from the Cookiepocalypse spreadsheet) ----
const key = s => String(s ?? '').trim().toLowerCase();
const num = v => (typeof v === 'number' && isFinite(v)) ? v : (v === '' || v == null ? null : (isFinite(+v) ? +v : null));

function totalUnits(state) {
  // People!C13 = SUM(C2:C12)
  return state.people.reduce((a, p) => a + (num(p.units) || 0), 0);
}
function findRecipe(state, name) {
  const k = key(name);
  return state.recipes.find(r => key(r.name) === k) || null;
}
function batchesFor(state, item, units) {
  // 'Recipe List'!A = CEILING(CookiesPerUnit * People!C13 / #OfCookies, 1)
  const r = findRecipe(state, item.recipe);
  const per = r ? num(r.cookiesPerBatch) : null;
  const cpu = num(item.cookiesPerUnit);
  if (!per || cpu == null) return null;
  return Math.ceil(cpu * units / per - 1e-9);
}
function gramFor(state, ing) {
  // Recipe grams column: entered value; if blank, fall back to Gram Conversions (amount × grams per unit)
  const g = num(ing.grams);
  if (g != null && (g > 0 || !num(ing.amount))) return { grams: g, derived: false };
  const c = state.gramConversions.find(c => key(c.ingredient) === key(ing.name) && key(c.unit) === key(ing.unit));
  if (c && num(c.grams) != null && num(ing.amount) != null) return { grams: num(ing.amount) * num(c.grams), derived: true };
  return { grams: null, derived: false };
}
function planRows(state) {
  const units = totalUnits(state);
  return state.plan.map(item => {
    const r = findRecipe(state, item.recipe);
    const batches = batchesFor(state, item, units);
    const bm = r ? num(r.bakeMinutes) : null;
    return {
      item, recipe: r, batches,
      cookies: (batches != null && r) ? batches * num(r.cookiesPerBatch) : null,
      // 'Total Bake Time (hr)' = BakeTimePerBatch * batches / 60
      bakeHours: (bm != null && batches != null) ? bm * batches / 60 : null,
    };
  });
}
function shoppingList(state, opts = {}) {
  // Shopping List: unique (Name, Unit) across selected recipes; Amount = SUM of scaled amounts;
  // Bulk Unit / Bulk Amount from Bulk Conversions (Amount / Conversion(A/B)).
  // Extras: substitutions (buy one ingredient as others, split by weight) and combining rows that share a bulk unit.
  const subsOn = opts.substitutions !== false, mergeOn = opts.merge !== false;
  const map = new Map();
  const add = (name, unit, amount, grams, recipeLabel) => {
    const k = key(name) + '|' + key(unit);
    let e = map.get(k);
    if (!e) { e = { key: k, name: String(name).trim(), unit: String(unit || '').trim(), amount: 0, grams: 0, gramsMissing: false, recipes: [] }; map.set(k, e); }
    e.amount += amount;
    if (grams == null) e.gramsMissing = true; else e.grams += grams;
    if (!e.recipes.includes(recipeLabel)) e.recipes.push(recipeLabel);
  };
  for (const row of planRows(state)) {
    if (!row.recipe || row.batches == null) continue;
    for (const ing of row.recipe.ingredients) {
      if (!String(ing.name || '').trim()) continue;
      const g = gramFor(state, ing);
      const amount = (num(ing.amount) || 0) * row.batches;
      const subs = subsOn ? (state.substitutions || []).filter(x => key(x.ingredient) === key(ing.name) && num(x.share)) : [];
      if (subs.length && g.grams != null) {
        for (const x of subs) { const sg = g.grams * row.batches * num(x.share); add(x.buyAs, 'Grams', sg, sg, row.recipe.name + ' (as ' + ing.name.trim() + ')'); }
        continue;
      }
      const ui = unitInfo(ing.unit);
      if (opts.byWeight !== false && g.grams != null && ui && ui.kind !== 'butterstick' && !(ui.kind === 'vol' && key(ing.unit).startsWith('m'))) {
        add(ing.name, 'Grams', g.grams * row.batches, g.grams * row.batches, row.recipe.name);   // weights are the source of truth
      } else add(ing.name, ing.unit, amount, g.grams == null ? null : g.grams * row.batches, row.recipe.name);
    }
  }
  let out = [...map.values()].filter(e => e.amount > 0);
  for (const e of out) {
    const b = state.bulkConversions.find(b => key(b.ingredient) === key(e.name) && key(b.unit) === key(e.unit));
    if (b && num(b.perBulk)) { e.bulkUnit = b.bulkUnit; e.bulkAmount = e.amount / num(b.perBulk); }
    else if (opts.defaultBulk !== false && key(e.unit) === 'grams') { const lb = e.amount >= 453.592; e.bulkUnit = lb ? 'Pounds' : 'Ounces'; e.bulkAmount = e.amount / (lb ? 453.592 : 28.3495); }
    else if (opts.defaultBulk !== false && key(e.unit) === 'milliliters') { e.bulkUnit = 'Fluid Ounces'; e.bulkAmount = e.amount / 29.5735; }
    e.parts = [{ amount: e.amount, unit: e.unit }];
  }
  if (mergeOn) {
    const merged = new Map(), rest = [];
    for (const e of out) {
      if (!e.bulkUnit) { rest.push(e); continue; }
      const k = key(e.name) + '|bulk:' + key(e.bulkUnit);
      const m = merged.get(k);
      if (!m) { merged.set(k, { ...e, key: k, parts: [...e.parts], recipes: [...e.recipes] }); continue; }
      m.parts.push(...e.parts); m.bulkAmount += e.bulkAmount; m.grams += e.grams; m.gramsMissing = m.gramsMissing || e.gramsMissing;
      for (const r of e.recipes) if (!m.recipes.includes(r)) m.recipes.push(r);
    }
    for (const m of merged.values()) if (m.parts.length > 1) { m.amount = null; m.unit = ''; }
    // single-row bulk entries keep their original name|unit key so existing checkmarks survive
    for (const [k, m] of merged) if (m.parts.length === 1) m.key = key(m.name) + '|' + key(m.parts[0].unit);
    out = [...rest, ...merged.values()];
  }
  for (const e of out) e.purchased = !!(state.purchased || {})[e.key];
  out.sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }) || String(a.unit).localeCompare(String(b.unit)));
  return out;
}

// Weights are the source of truth; the volume/count measure is derived from grams where a conversion exists.
function measureFor(state, ing, mult = 1) {
  const g = gramFor(state, ing).grams;
  const ui = unitInfo(ing.unit);
  if (g != null && ui && ui.kind !== 'butterstick') {
    const gp = gramsPerUnit(state, ing.name, ing.unit);
    if (gp && gp.g) return { amount: g * mult / gp.g, unit: ing.unit };
  }
  return { amount: (num(ing.amount) || 0) * mult, unit: ing.unit };
}
// Keep amount and grams in step after an edit. which = 'grams' (weight edited) or 'measure' (amount/unit edited).
function syncIngredient(state, ing, which) {
  const ui = unitInfo(ing.unit);
  if (ui && ui.kind === 'wt') { if (which === 'grams' && num(ing.grams) != null) ing.amount = ing.grams / ui.f; else ing.grams = (num(ing.amount) || 0) * ui.f; return; }
  const gp = gramsPerUnit(state, ing.name, ing.unit);
  if (!gp || !gp.g) return;
  if (which === 'grams' && num(ing.grams) != null) { if (!ui || ui.kind === 'vol') ing.amount = ing.grams / gp.g; }
  else ing.grams = Math.round((num(ing.amount) || 0) * gp.g * 100) / 100;
}

// Salt: recipes assume table salt by volume; show the kosher-salt equivalent for the baker's salt.
function kosherTsp(state, ing, mult = 1) {
  const kg = num(state.kosherSaltGPerTsp);
  if (!kg || key(ing.name) !== 'salt') return null;
  const ui = unitInfo(ing.unit);
  if (!ui || ui.kind !== 'vol') return null;
  const g = gramFor(state, ing).grams;
  return g == null ? null : g * mult / kg;
}

// Apply a data patch (conversions, renames, recipe ingredient edits, settings). Idempotent per id.
function applyPatch(state, p) {
  if (!p || (state.appliedPatches || []).includes(p.id)) return false;
  const sameIng = (a, b) => key(a.ingredient) === key(b.ingredient) && key(a.unit) === key(b.unit);
  for (const rn of p.renames || []) {
    const from = new Set(rn.from.map(key));
    const cf = rn.field === 'name' ? 'ingredient' : 'unit';
    for (const r of state.recipes) for (const i of r.ingredients) if (from.has(key(i[rn.field]))) i[rn.field] = rn.to;
    for (const c of [...state.gramConversions, ...state.bulkConversions]) if (from.has(key(c[cf]))) c[cf] = rn.to;
  }
  for (const ed of p.ingredientEdits || []) {
    const r = state.recipes.find(x => key(x.name) === key(ed.recipe)); if (!r) continue;
    const out = [];
    for (const i of r.ingredients) {
      if (key(i.name) === key(ed.find.name) && (!ed.find.unit || key(i.unit) === key(ed.find.unit)) && (!ed.find.phase || key(i.phase || '').includes(key(ed.find.phase)))) {
        for (const rw of ed.replaceWith) { const n = { ...rw }; if (!n.phase && i.phase) n.phase = i.phase; out.push(n); }
      } else out.push(i);
    }
    r.ingredients = out;
  }
  const upsert = (arr, row, extraMatch) => {
    const idx = []; arr.forEach((c, n) => { if (sameIng(c, row) && (!extraMatch || extraMatch(c))) idx.push(n); });
    if (!idx.length) { arr.push({ ...row }); return; }
    Object.assign(arr[idx[0]], row);
    for (const n of idx.slice(1).reverse()) arr.splice(n, 1);
  };
  for (const g of p.gram || []) upsert(state.gramConversions, g);
  for (const b of p.bulk || []) upsert(state.bulkConversions, b);
  if (p.recalcBulk) {
    for (const b of state.bulkConversions) {
      const ua = unitInfo(b.unit), ub = unitInfo(b.bulkUnit);
      if (!ua || !ub || ub.kind !== 'wt') continue;
      if (ua.kind === 'wt') b.perBulk = Math.round(ub.f / ua.f * 10000) / 10000;
      else if (ua.kind === 'vol') { const gp = gramsPerUnit(state, b.ingredient, b.unit); if (gp && gp.g) b.perBulk = Math.round(ub.f / gp.g * 10000) / 10000; }
    }
  }
  if (p.syncWeights) {
    for (const r of state.recipes) for (const i of r.ingredients) {
      const ui = unitInfo(i.unit);
      const typed = num(i.grams) != null && (num(i.grams) > 0 || !num(i.amount));
      if (ui && ui.kind === 'wt') { if (typed) i.amount = i.grams / ui.f; else i.grams = (num(i.amount) || 0) * ui.f; continue; }
      const gp = gramsPerUnit(state, i.name, i.unit);
      if (!gp || !gp.g) { if (!typed) delete i.grams; continue; }
      if (typed) { if (ui && ui.kind === 'vol') i.amount = Math.round(i.grams / gp.g * 10000) / 10000; }
      else i.grams = Math.round((num(i.amount) || 0) * gp.g * 100) / 100;
    }
  }
  for (const sp of p.splits || []) {
    for (const r of state.recipes) {
      const out = [];
      for (const i of r.ingredients) {
        if (key(i.name) !== key(sp.name) || num(i.grams) == null) { out.push(i); continue; }
        for (const part of sp.into) {
          const g = Math.round(i.grams * part.share * 100) / 100;
          const ex = out.find(o => key(o.name) === key(part.name) && key(o.unit) === key(i.unit) && (o.phase || '') === (i.phase || ''));
          const gp = gramsPerUnit(state, part.name, i.unit), ui = unitInfo(i.unit);
          const toAmt = grams => ui && ui.kind === 'wt' ? grams / ui.f : gp ? Math.round(grams / gp.g * 10000) / 10000 : grams;
          if (ex && num(ex.grams) != null) { ex.grams = Math.round((ex.grams + g) * 100) / 100; ex.amount = toAmt(ex.grams); }
          else { const n = { name: part.name, amount: toAmt(g), unit: i.unit, grams: g }; if (i.phase) n.phase = i.phase; out.push(n); }
        }
      }
      // merge same ingredient + unit + phase rows created by the split
      const merged = [];
      for (const i of out) {
        const ex = merged.find(o => key(o.name) === key(i.name) && key(o.unit) === key(i.unit) && (o.phase || '') === (i.phase || '') && num(o.grams) != null && num(i.grams) != null);
        if (ex && sp.into.some(x => key(x.name) === key(i.name))) { ex.grams = Math.round((ex.grams + i.grams) * 100) / 100; ex.amount = (num(ex.amount) || 0) + (num(i.amount) || 0); }
        else merged.push(i);
      }
      r.ingredients = merged;
    }
  }
  for (const rs of p.removeSubstitutions || []) state.substitutions = (state.substitutions || []).filter(x => key(x.ingredient) !== key(rs));
  for (const nt of p.notes || []) { const r = state.recipes.find(x => key(x.name) === key(nt.recipe)); if (r) r.notes = nt.notes; }
  for (const t of p.times || []) { const r = state.recipes.find(x => key(x.name) === key(t.recipe)); if (r) for (const f of ['prepMinutes', 'restMinutes', 'bakeMinutes']) if (t[f] != null && (r[f] == null || t.overwrite)) r[f] = t[f]; }
  for (const mr of p.methodReplace || []) for (const r of state.recipes) if (r.method) r.method = r.method.split(mr.from).join(mr.to);
  for (const mt of p.methods || []) { const r = state.recipes.find(x => key(x.name) === key(mt.recipe)); if (r) { if (!r.method || mt.overwrite) r.method = mt.method; if (mt.notes != null) r.notes = mt.notes; } }
  if (p.setPlan) {
    const prev = new Map(state.plan.map(x => [key(x.recipe), x]));
    state.plan = p.setPlan.filter(n => state.recipes.some(r => key(r.name) === key(n))).map(n => prev.get(key(n)) || { recipe: n, cookiesPerUnit: 6, bakeDay: '' });
  }
  if (p.removeRecipes) {
    const inPlan = new Set(state.plan.map(x => key(x.recipe)));
    const drop = new Set(p.removeRecipes.map(key));
    state.recipes = state.recipes.filter(r => !drop.has(key(r.name)) || inPlan.has(key(r.name)));
  }
  if (p.removeEmptyRecipes) {
    const inPlan = new Set(state.plan.map(x => key(x.recipe)));
    state.recipes = state.recipes.filter(r => r.ingredients.length || inPlan.has(key(r.name)));
  }
  if (p.pruneConversions) {
    const used = new Set(state.recipes.flatMap(r => r.ingredients.map(i => key(i.name))));
    state.gramConversions = state.gramConversions.filter(c => used.has(key(c.ingredient)));
    state.bulkConversions = state.bulkConversions.filter(c => used.has(key(c.ingredient)));
  }
  for (const x of p.substitutions || []) {
    state.substitutions = state.substitutions || [];
    if (!state.substitutions.some(y => key(y.ingredient) === key(x.ingredient) && key(y.buyAs) === key(x.buyAs))) state.substitutions.push({ ...x });
  }
  if (p.settings) Object.assign(state, p.settings);
  // Add a baking-plan session (skipped if one with the same label already exists), placed after the session named in `after`
  for (const si of p.sessionInsert || []) {
    state.sessions = state.sessions || [];
    if (state.sessions.some(x => si.session.label && x.label === si.session.label)) continue;
    const at = state.sessions.findIndex(x => (si.after?.n != null && x.n === si.after.n) || (si.after?.label && x.label === si.after.label));
    const sess = JSON.parse(JSON.stringify(si.session));
    sess.tasks = (sess.tasks || []).map(t => typeof t === 'string' ? { text: t, done: false } : t);
    state.sessions.splice(at < 0 ? state.sessions.length : at + 1, 0, sess);
  }

  let uid = null;
  try { uid = user ? await user.id() : null; } catch (e) {}

    const timer = setTimeout(() => setStatus('busy', 'Still connecting…'), 10000);

// A fresh start gets the starter data with every update already applied, so later loads don't re-apply them over your edits

// Bring in recipes/conversions added to the starter data since this plan was created (never overwrites)
async function mergeNewSeed() {

  let patched = 0;
  for (const p of seed.patches || []) if (applyPatch(S, p)) patched++;
  if (patched) { scheduleSave(); setTimeout(() => toast('Conversions updated'), 1200); }
  if (seed.seedVersion <= (S.seedVersion || 1)) return;
  let n = 0;
  for (const r of seed.recipes) if (!S.recipes.some(x => key(x.name) === key(r.name))) { S.recipes.push(r); n++; }
  for (const c of seed.gramConversions) if (!S.gramConversions.some(x => key(x.ingredient) === key(c.ingredient) && key(x.unit) === key(c.unit))) S.gramConversions.push(c);
  for (const c of seed.bulkConversions) if (!S.bulkConversions.some(x => key(x.ingredient) === key(c.ingredient) && key(x.unit) === key(c.unit))) S.bulkConversions.push(c);
  S.seedVersion = seed.seedVersion; scheduleSave();
  if (n) setTimeout(() => toast(`Added ${n} new recipe${n > 1 ? 's' : ''} from your other sheets`), 600);
}
async function fetchSeed() {
  for (const url of ['seed.json', 'data/seed.json']) {
    try {
      const r = await fetch(url, { cache: 'no-store' });
      if (r.ok) { const raw = await r.json(); const st = normalizeState(raw); st.patches = Array.isArray(raw.patches) ? raw.patches : []; return st; }
    } catch (e) {}

}
function loadLocal() { try { const t = localStorage.getItem(LS_KEY); return t ? normalizeState(JSON.parse(t)) : null; } catch (e) { return null; } }

function commit(opts = {}) { scheduleSave(); if (opts.render !== false) render(); }
function scheduleSave() {
  clearTimeout(store.timer);
  store.timer = setTimeout(flush, 700);
  if (store.mode === 'db') setStatus('busy', 'Saving…');
}
async function flush() {
  const json = JSON.stringify(S);
  try { localStorage.setItem(LS_KEY, json); } catch (e) {}
  if (store.mode === 'file') return flushFile(json);
  if (store.mode !== 'db') return;
  if (store.writing) { store.pending = true; return; }
  store.writing = true;
  try {
    if (json.length > 250000) throw { code: 'too_big' };
    await store.db.doc('data/users/' + store.uid + '/state').set({ json, savedAt: new Date().toISOString() });
    setStatus('ok', 'Saved to your account');
  } catch (e) {
    if (e && e.code === 'unavailable') { setTimeout(flush, 1500 + Math.random() * 1500); }
    else if (e && (e.code === 'too_big' || e.code === 'invalid_argument' || e.code === 'quota_exceeded')) setStatus('err', 'Not saved: plan is too large for account storage. Export a backup');
    else setStatus('err', 'Couldn’t save (' + (e?.code || 'error') + '). Export a backup');
  } finally {
    store.writing = false;
    if (store.pending) { store.pending = false; flush(); }
  }
}

async function flushFile(json) {
  if (store.writing) { store.pending = true; return; }
  store.writing = true; setStatus('busy', 'Saving…');
  try {
    const r = await fetch('/api/state', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: json });
    if (!r.ok) throw new Error(r.status);
    setStatus('ok', 'Saved to saves/state.json');
  } catch (e) { setStatus('err', 'Couldn’t save to saves/. Is serve.py still running?'); }
  finally { store.writing = false; if (store.pending) { store.pending = false; flush(); } }
}

// Cooking for Engineers table: ingredients as rows (order of first use), steps as columns, cells span what they combine.
function renderCFE(r, batches, mode) {
  const pm = parseMethod(r, r.method);
  if (!pm.root || !pm.rows.length) return null;
  const cols = pm.cols + 1, nRows = pm.rows.length;
  const cells = Array.from({ length: nRows }, () => []);
  const put = (row, col, html) => { cells[row].push({ col, html }); };
  const ingCell = (n) => {
    if (n.kind === 'extra') return `<td class="ing extra">${esc(n.text)}</td>`;
    const i = n.ing, g = gramFor(S, i).grams;
    const mult = mode === 'batch' ? 1 : (batches ?? 1);
    const qty = g != null ? `<b>${fmt(g * mult, g * mult >= 10 ? 0 : 1)} g</b>` : `<b>${amt(measureFor(S, i, mult).amount)} ${esc(i.unit)}</b>`;
    const meas = g != null && key(i.unit) !== 'grams' ? ` <span class="muted small">(${measureTxt(i, mult)})</span>` : '';
    const per = mode === 'both' && batches && g != null ? ` <span class="muted small">· ${fmt(g, g >= 10 ? 0 : 1)} g/batch</span>` : '';
    const salt = kosherTsp(S, i, mult) != null ? ` <span class="small" style="color:var(--green)">≈ ${amt(kosherTsp(S, i, mult))} tsp kosher</span>` : '';
    return `<td class="ing">${qty} ${esc(i.name)}${meas}${per}${salt}</td>`;
  };
  const place = (n) => {
    if (n.kind !== 'step') { put(n.r0, 0, ingCell(n)); return; }
    for (const c of n.inputs) {
      place(c);
      for (let col = c.h + 1; col < n.h; col++) put(c.r0, col, `<td class="gap" rowspan="${c.r1 - c.r0}"></td>`);
    }
    put(n.r0, n.h, `<td class="op${n === pm.root ? ' final' : ''}" rowspan="${n.r1 - n.r0}">${esc(n.text)}</td>`);
  };
  place(pm.root);
  const prep = pm.prep.map(t => `<tr><td class="prep" colspan="${cols}">${esc(t)}</td></tr>`).join('');
  const body = cells.map(rc => '<tr>' + rc.sort((a, b) => a.col - b.col).map(c => c.html).join('') + '</tr>').join('');
  return { html: `<div class="tablewrap"><table class="cfe">${prep}${body}</table></div>`, warnings: pm.warnings };
}

      <button class="btn" data-act="exportOne" data-fmt="json">Export JSON</button>
      <button class="btn" data-act="dupRecipe">Duplicate</button>
      <button class="btn ghost" data-act="delRecipe">Delete</button>
    </div>
    <div class="card">
      <div class="kv">
        <label style="grid-column:1/-1">Recipe name<input data-r="${ri}" data-f="name" value="${esc(r.name)}" style="font:600 20px Oswald,sans-serif"></label>
        <label>Book / source<input data-r="${ri}" data-f="book" value="${esc(r.book)}"></label>
        <label>Source link<input data-r="${ri}" data-f="bookUrl" value="${esc(r.bookUrl)}" placeholder="https://…"></label>
        <label>Page<input data-r="${ri}" data-f="page" value="${esc(r.page)}"></label>
        <label># of cookies per batch<input type="number" step="any" data-r="${ri}" data-f="cookiesPerBatch" data-num value="${esc(r.cookiesPerBatch ?? '')}"></label>
        <label>Refrigerate?<input data-r="${ri}" data-f="refrigerate" value="${esc(r.refrigerate)}"></label>
        <label>Oven temp (°F)<input data-r="${ri}" data-f="ovenTemp" value="${esc(r.ovenTemp)}"></label>
        <label>Prep time per batch (min)<input type="number" step="any" data-r="${ri}" data-f="prepMinutes" data-num value="${esc(r.prepMinutes ?? '')}" title="Assembling ingredients and cooking components"></label>
        <label>Rest time per batch (min)<input type="number" step="any" data-r="${ri}" data-f="restMinutes" data-num value="${esc(r.restMinutes ?? '')}" title="Chilling, cooling, setting"></label>
        <label>Bake time per batch (min)<input type="number" step="any" data-r="${ri}" data-f="bakeMinutes" data-num value="${esc(r.bakeMinutes ?? '')}" title="Time in the oven"></label>
        <label>Total time per batch<input disabled value="${esc(fmtMinutes(totalMinutes(r)) || '—')}" style="background:#f6f1ea"></label>
      </div>
    </div>
    <div class="card">
      <div class="row" style="margin-bottom:8px"><h2 class="grow" style="font-size:18px">Ingredients <span class="muted small" style="font-family:Inter;text-transform:none">per batch · ${fmt(totalG, 0)} g total</span></h2>
        <button class="btn sm" data-act="fillGrams" title="Fill blank grams from the Gram Conversions table">Fill missing weights</button></div>
      <div class="tablewrap"><table>
        <thead><tr><th style="width:28px"></th><th>Ingredient</th><th class="n" style="width:110px">Weight (g)</th><th class="n" style="width:100px">Measure</th><th style="width:140px">Unit</th><th style="width:150px">Phase</th>${inPlan ? '<th class="n">× ' + pr.batches + ' batches</th>' : ''}<th style="width:40px"></th></tr></thead>
        <tbody>${r.ingredients.map((i, n) => {
          const g = gramFor(S, i);
          const m = measureFor(S, i);
          return `<tr>
          <td class="handle small"><span data-mv="${n}" data-d="-1" title="Move up">▲</span><br><span data-mv="${n}" data-d="1" title="Move down">▼</span></td>
          <td><input list="dl-ings" data-ing="${n}" data-f="name" value="${esc(i.name)}"></td>
          <td><input type="number" step="any" class="num" style="width:100%;font-weight:600;${g.grams == null ? 'border-color:var(--gold)' : ''}" data-ing="${n}" data-f="grams" data-num value="${esc(num(i.grams) != null ? +(+i.grams).toFixed(2) : '')}" placeholder="${g.derived ? fmt(g.grams) : 'add weight'}" title="${g.derived ? 'From the conversion table' : g.grams == null ? 'No weight yet' : 'Source of truth'}"></td>
          <td><input type="number" step="any" class="num" style="width:100%" data-ing="${n}" data-f="amount" data-num value="${esc(m.amount != null ? +(+m.amount).toFixed(3) : '')}"></td>
          <td><input list="dl-units" data-ing="${n}" data-f="unit" value="${esc(i.unit)}">${saltNote(i)}</td>
          <td><input list="dl-phases" data-ing="${n}" data-f="phase" value="${esc(i.phase ?? '')}"></td>
          ${inPlan ? `<td class="n small">${g.grams != null ? `<b>${fmt(g.grams * pr.batches, 0)} g</b><br>` : ''}<span class="muted">${amt(measureFor(S, i, pr.batches).amount)} ${esc(i.unit)}</span></td>` : ''}

      <span class="muted small">Weight is the source of truth. Edit the weight and the measure follows (via King Arthur's conversions); edit the measure and the weight is recalculated. Pick names from the suggestions so they match your conversions.</span></div>
    </div>
    <div class="card">
      <div class="row" style="margin-bottom:6px"><h2 class="grow" style="font-size:18px">Method</h2><button class="btn ghost sm" data-act="methodHelp">How to write it</button></div>
      <div class="split">
        <textarea class="method" id="methodText" data-r="${ri}" data-f="method" spellcheck="false" placeholder="prep: Heat oven to 350°F; line sheets&#10;creamed = cream until fluffy, 2 min <- Butter + Granulated Sugar&#10;dry = whisk <- Flour + Baking Powder + Salt&#10;dough = mix on low just until combined <- creamed + dry&#10;bake 350°F 10–12 min <- dough">${esc(r.method)}</textarea>

}

// ======================= CHEAT SHEET =======================
function vCheat() {
  const rows = planRows(S).filter(r => r.recipe).sort((a, b) => (num(a.item.bakeDay) ?? 999) - (num(b.item.bakeDay) ?? 999));
  if (!rows.length) return `<div class="empty">Add recipes to the <a href="#plan">plan</a> to build the cheat sheet.</div>`;
  const show = ui.cheat;
  return `<div class="row" style="margin-bottom:14px"><span class="muted">Ordered by “When to bake?”</span><span class="grow"></span>
    <div class="seg">${[['both', 'Per batch + total'], ['batch', 'Per batch'], ['total', 'Total']].map(([k, l]) => `<button data-cheat="${k}" class="${show === k ? 'on' : ''}">${l}</button>`).join('')}</div>
    <button class="btn" data-act="exportCheat">Export CSV</button></div>
  ${rows.map(r => {
    const rec = r.recipe, b = r.batches;
    const phases = []; let last = null;
    rec.ingredients.forEach(i => { const p = i.phase || ''; if (p !== last) { phases.push({ p, items: [] }); last = p; } phases[phases.length - 1].items.push(i); });
    const hasPhases = rec.ingredients.some(i => i.phase);
    return `<div class="card">
      <div class="sheet-head"><h2>${esc(rec.name)}</h2><span class="muted">${srcHtml(rec)}</span><span class="grow"></span>${r.item.bakeDay !== '' && r.item.bakeDay != null ? `<span class="pill gold">Bake: ${esc(r.item.bakeDay)}</span>` : ''}</div>
      <div class="facts">
        <span class="pill red">${b ?? '?'} batches</span>
        ${rec.ovenTemp ? `<span class="pill">${esc(rec.ovenTemp)}°F</span>` : ''}
        ${totalMinutes(rec) != null ? `<span class="pill gold">Total ${fmtMinutes(totalMinutes(rec))} / batch</span>` : ''}
        ${rec.prepMinutes != null ? `<span class="pill">Prep ${fmtMinutes(rec.prepMinutes)}</span>` : ''}
        ${rec.restMinutes != null ? `<span class="pill">Rest ${fmtMinutes(rec.restMinutes)}</span>` : ''}
        ${rec.bakeMinutes != null ? `<span class="pill">Bake ${fmtMinutes(rec.bakeMinutes)}</span>` : ''}
        ${r.bakeHours != null ? `<span class="pill">${fmt(r.bakeHours, 1)} h oven for all batches</span>` : ''}
        ${rec.refrigerate ? `<span class="pill green">Chill: ${esc(rec.refrigerate)}</span>` : ''}
        ${r.cookies != null ? `<span class="pill">${fmt(r.cookies, 0)} cookies</span>` : ''}
      </div>
      ${rec.method && renderCFE(rec, b, show) ? renderCFE(rec, b, show).html : `<div class="tablewrap"><table>
        <thead><tr><th>Ingredient</th>${show !== 'total' ? '<th class="n">Per batch (g)</th><th class="n">≈ measure</th>' : ''}${show !== 'batch' ? `<th class="n">Total ×${b ?? '?'} (g)</th><th class="n">≈ measure</th>` : ''}</tr></thead>
        <tbody>${phases.map(ph => (hasPhases ? `<tr class="phase-row"><td colspan="5">${esc(ph.p || 'Other')}</td></tr>` : '') + ph.items.map(i => {
          const g = gramFor(S, i);
          const gcell = v => v == null ? '' : `<span class="${g.derived ? 'derived' : ''}">${fmt(v, v >= 10 ? 0 : 1)}</span>`;
          return `<tr><td>${esc(i.name)}</td>
            ${show !== 'total' ? `<td class="n"><b>${gcell(g.grams)}</b></td><td class="n muted">${measureTxt(i, 1)}${saltNote(i)}</td>` : ''}
            ${show !== 'batch' ? `<td class="n"><b>${g.grams != null && b != null ? gcell(g.grams * b) : ''}</b></td><td class="n muted">${b != null ? measureTxt(i, b) + saltNote(i, b) : ''}</td>` : ''}</tr>`;
        }).join('')).join('')}</tbody></table></div>`}
      ${rec.notes ? `<p class="small" style="white-space:pre-wrap;margin-top:10px">${esc(rec.notes)}</p>` : ''}
    </div>`;
  }).join('')}`;
}

// ======================= SHOPPING =======================
function vShopping() {
  const list = shoppingList(S);
  const shown = ui.hidePurchased ? list.filter(e => !e.purchased) : list;
  const done = list.filter(e => e.purchased).length;
  if (!list.length) return `<div class="empty">Nothing to buy yet. Add recipes to the <a href="#plan">plan</a>.</div>`;
  return `<div class="row" style="margin-bottom:14px">
      <span><b>${list.length - done}</b> to buy · <span class="muted">${done} purchased</span></span>
      <label class="small"><input type="checkbox" id="hidePurch" ${ui.hidePurchased ? 'checked' : ''}> Hide purchased</label>
      <span class="grow"></span>
      <button class="btn" data-act="copyShop">Copy as text</button>
      <button class="btn" data-act="exportShop">Export CSV</button>
      <button class="btn ghost" data-act="clearPurch">Uncheck all</button>
    </div>
    <div class="card" style="padding:6px 12px"><div class="tablewrap"><table>
      <thead><tr><th style="width:34px">✓</th><th>Ingredient</th><th class="n">Recipes need</th><th class="n">Buy</th><th>Bulk unit</th><th class="n">≈ Grams</th><th>Used in</th></tr></thead>
      <tbody>${shown.map(e => `<tr class="${e.purchased ? 'done' : ''}">
        <td><input type="checkbox" data-purch="${esc(e.key)}" ${e.purchased ? 'checked' : ''}></td>
        <td class="nm"><b>${esc(e.name)}</b></td>
        <td class="n">${e.parts.map(p => amt(p.amount) + ' ' + esc(p.unit)).join('<br>')}</td>
        <td class="n">${e.bulkAmount != null ? '<b>' + amt(e.bulkAmount) + '</b>' : '<span class="muted small">—</span>'}</td><td>${esc(e.bulkUnit ?? '')}</td>
        <td class="n">${e.grams ? fmt(e.grams, 0) + (e.gramsMissing ? '<span class="muted" title="Some recipes have no gram value for this">+</span>' : '') : ''}</td>
        <td class="small muted">${esc(e.recipes.join(', '))}</td></tr>`).join('')}</tbody></table></div></div>
    <p class="muted small">Recipes need = per-batch amount × batches, summed by ingredient + unit. Buy = that ÷ the Bulk Conversions factor; rows of one ingredient that convert to the same bulk unit are combined. ${S.substitutions.length ? 'Substitutions (e.g. ' + esc(S.substitutions[0].ingredient) + ' bought as ' + S.substitutions.filter(x => key(x.ingredient) === key(S.substitutions[0].ingredient)).map(x => esc(x.buyAs)).join(' + ') + ') are applied by weight; ' : ''}see the <a href="#conversions">Conversions</a> tab.</p>`;
}
function shopCSV() {
  return ['Ingredient,Recipes Need,Buy Amount,Buy Unit,Grams,Purchased,Used In'].concat(shoppingList(S).map(e =>
    [e.name, e.parts.map(p => +p.amount.toFixed(3) + ' ' + p.unit).join(' + '), e.bulkAmount != null ? +e.bulkAmount.toFixed(3) : '', e.bulkUnit ?? '', e.grams ? Math.round(e.grams) : '', e.purchased ? 'yes' : '', e.recipes.join('; ')].map(csvEsc).join(','))).join('\n');
}

// ======================= CONVERSIONS =======================
function vConversions() {
  const { issues, coverage } = conversionChecks(S);
  const vis = issues.filter(i => !S.ignoredChecks[i.id]);
  const nIgnored = issues.length - vis.length;
  const main = vis.filter(i => i.severity !== 'low'), low = vis.filter(i => i.severity === 'low');
  const issueHtml = i => `<div class="issue"><div class="sev ${i.severity}"></div><div class="grow"><div class="t">${esc(i.title)} ${i.planned ? '<span class="pill green">in plan</span>' : ''}</div><div class="small muted">${esc(i.detail)}</div></div>
     <div class="row" style="gap:6px;flex-wrap:nowrap">${i.fix ? `<button class="btn sm" data-fix="${esc(i.id)}">${fixLabel(i.fix)}</button>` : ''}${(i.choices || []).map((c, n) => `<button class="btn sm" data-fix="${esc(i.id)}" data-choice="${n}">${esc(c.label)}</button>`).join('')}<button class="btn ghost sm" data-ignore="${esc(i.id)}" title="Mark as OK">Looks right</button></div></div>`;
  const c = ui.conv;
  const gp = c.name ? gramsPerUnit(S, c.name, c.unit) : null;
  const grams = gp ? (num(c.amount) || 0) * gp.g : null;
  const per = n => { const g = c.name ? gramsPerUnit(S, c.name, n) : null; return g ? grams / g.g : null; };
  const used = coverage.filter(x => x.planned);
  return `<div class="split">
    <div>
      <div class="card">
        <div class="row" style="margin-bottom:6px"><h2 class="grow" style="font-size:20px">Conversion check</h2>${nIgnored ? `<button class="btn ghost sm" data-act="unignore">Show ${nIgnored} marked OK</button>` : ''}</div>
        <p class="muted small" style="margin-top:0">Compares grams typed into recipes against the Gram Conversions table, checks the table against itself (cups vs tablespoons, duplicates), and checks bulk factors against weights.</p>
        ${main.length ? main.map(issueHtml).join('') : '<div class="muted" style="padding:10px 0">✓ No conflicts found.</div>'}
        ${low.length ? `<div style="margin-top:10px"><button class="btn ghost sm" data-act="toggleLow">${ui.showLow ? 'Hide' : 'Show'} ${low.length} gaps &amp; spelling notes</button></div>${ui.showLow ? low.map(issueHtml).join('') : ''}` : ''}
      </div>
      <div class="card">
        <h2 style="font-size:18px;margin-bottom:8px">Quick converter</h2>
        <div class="row">
          <input type="number" step="any" id="cvAmt" value="${esc(c.amount)}" class="num">
          <input list="dl-units" id="cvUnit" value="${esc(c.unit)}" class="w-s" style="width:120px">
          <input list="dl-ings" id="cvName" value="${esc(c.name)}" placeholder="Ingredient…" class="grow">
        </div>
        ${c.name ? (gp ? `<table style="margin-top:10px"><tbody>
          <tr><td>Grams</td><td class="n"><b>${fmt(grams)}</b> g</td><td class="small muted">${esc(gp.how)}</td></tr>
          ${['Teaspoons', 'Tablespoons', 'Cups', 'Ounces', 'Pounds'].filter(u => key(u) !== key(c.unit)).map(u => { const v = per(u); return v != null ? `<tr><td>${u}</td><td class="n">${amt(v)}</td><td></td></tr>` : ''; }).join('')}
          ${S.bulkConversions.filter(b => key(b.ingredient) === key(c.name) && key(b.unit) === key(c.unit)).map(b => `<tr><td>${esc(b.bulkUnit)} <span class="muted small">(bulk)</span></td><td class="n">${amt((num(c.amount) || 0) / num(b.perBulk))}</td><td class="small muted">${fmt(b.perBulk)} ${esc(b.unit)} each</td></tr>`).join('')}
        </tbody></table>` : `<p class="warn" style="margin-top:10px">No gram conversion for ${esc(c.name)} in ${esc(c.unit)}. Add one below.</p>`) : ''}
      </div>
      <div class="card">
        <h2 style="font-size:18px;margin-bottom:8px">Planned ingredients</h2>
        <div class="tablewrap"><table><thead><tr><th>Ingredient</th><th>Unit</th><th class="n">g / unit</th><th>Bulk</th></tr></thead><tbody>
        ${used.map(u => `<tr><td>${esc(u.name)}</td><td>${esc(u.unit)}</td><td class="n">${u.grams ? fmt(u.grams.g) + (u.grams.how !== 'table' ? ' <span class="muted small">*</span>' : '') : '<span class="pill gold">none</span>'}</td><td>${u.bulk ? esc(u.bulk.bulkUnit) + ` <span class="muted small">(${fmt(u.bulk.perBulk)})</span>` : '<span class="muted small">—</span>'}</td></tr>`).join('')}
        </tbody></table></div><p class="muted small">* worked out from another unit or a weight unit.</p>
      </div>
    </div>
    <div>
      <div class="card">
        <h2 style="font-size:18px;margin-bottom:6px">Shopping substitutions</h2>
        <p class="muted small" style="margin-top:0">Buy one ingredient as others, split by weight. The recipe and cheat sheet keep the original ingredient.</p>
        <div class="tablewrap"><table><thead><tr><th>Recipe ingredient</th><th>Buy as</th><th class="n" style="width:110px">Share of weight</th><th style="width:40px"></th></tr></thead><tbody>
        ${S.substitutions.map((x, i) => `<tr><td><input list="dl-ings" data-sub="${i}" data-f="ingredient" value="${esc(x.ingredient)}"></td><td><input list="dl-ings" data-sub="${i}" data-f="buyAs" value="${esc(x.buyAs)}"></td><td><input type="number" step="any" class="num" style="width:100%" data-sub="${i}" data-f="share" data-num value="${esc(x.share ?? '')}"></td><td><button class="btn ghost sm" data-del-sub="${i}">✕</button></td></tr>`).join('')}
        </tbody></table></div>
        ${subsWarn()}
        <div class="row" style="margin-top:8px"><button class="btn sm" data-act="addSub">+ Add substitution</button></div>
      </div>
      <div class="card">
        <h2 style="font-size:18px;margin-bottom:6px">Salt</h2>
        <p class="muted small" style="margin-top:0">Recipe teaspoons of salt are treated as table salt (${fmt(gramsPerUnit(S, 'Salt', 'Teaspoons')?.g)} g/tsp), as most recipes assume. Enter grams per teaspoon of the salt you measure with to see its equivalent beside every salt amount. Morton kosher is about 4.8 g; Diamond Crystal is about 2.8 g; leave blank to turn off.</p>
        <label class="row small">Kosher salt, g per tsp <input type="number" step="any" class="num" id="kosherG" value="${esc(S.kosherSaltGPerTsp ?? '')}"></label>
      </div>
      ${convTable('Gram conversions', 'gram', ['Ingredient', 'Base unit', 'Grams'], ['ingredient', 'unit', 'grams'])}
      ${convTable('Bulk conversions', 'bulk', ['Ingredient', 'Recipe unit (A)', 'Bulk unit (B)', 'A per B'], ['ingredient', 'unit', 'bulkUnit', 'perBulk'])}
    </div></div>`;
}
function subsWarn() {
  const tot = {};
  for (const x of S.substitutions) tot[key(x.ingredient)] = (tot[key(x.ingredient)] || 0) + (num(x.share) || 0);
  const bad = Object.entries(tot).filter(([k, v]) => Math.abs(v - 1) > 0.001);
  return bad.length ? `<p class="warn" style="margin-top:8px">Shares should add up to 1 for: ${bad.map(([k, v]) => esc(k) + ' (' + fmt(v) + ')').join(', ')}</p>` : '';
}
function fixLabel(f) {
  if (f.kind === 'setGrams') return `Set to ${fmt(f.grams)} g`;
  if (f.kind === 'setBulk') return `Use ${fmt(f.perBulk)}`;
  if (f.kind === 'rename') return `Change to “${f.to}”`;
  return 'Fix';
}
function convTable(title, kind, heads, fields) {
  const arr = kind === 'gram' ? S.gramConversions : S.bulkConversions;
  return `<div class="card"><div class="row" style="margin-bottom:8px"><h2 class="grow" style="font-size:18px">${title} <span class="muted small" style="font-family:Inter;text-transform:none">${arr.length}</span></h2><button class="btn sm" data-act="addConv" data-k="${kind}">+ Add</button></div>
    <div class="tablewrap" style="max-height:520px;overflow:auto"><table><thead><tr>${heads.map((h, n) => `<th class="${n === heads.length - 1 ? 'n' : ''}" style="top:0">${h}</th>`).join('')}<th style="top:0"></th></tr></thead><tbody>
    ${arr.map((c, i) => `<tr>${fields.map((f, n) => `<td><input ${n === 0 ? 'list="dl-ings"' : n < fields.length - 1 ? 'list="dl-units"' : 'type="number" step="any" class="num" style="width:100%"'} data-conv="${kind}" data-i="${i}" data-f="${f}" ${n === fields.length - 1 ? 'data-num' : ''} value="${esc(c[f] ?? '')}"></td>`).join('')}<td><button class="btn ghost sm" data-del-conv="${kind}" data-i="${i}">✕</button></td></tr>`).join('')}
    </tbody></table></div></div>`;
}
function applyFix(f) {
  if (f.kind === 'setGrams') {
    const r = S.recipes.find(x => key(x.name) === key(f.recipe));
    r?.ingredients.filter(i => key(i.name) === key(f.ingredient) && key(i.unit) === key(f.unit) && num(i.amount) === f.amount).forEach(i => i.grams = f.grams);
  } else if (f.kind === 'setBulk') {
    S.bulkConversions.filter(b => key(b.ingredient) === key(f.ingredient) && key(b.unit) === key(f.unit) && key(b.bulkUnit) === key(f.bulkUnit)).forEach(b => b.perBulk = f.perBulk);
  } else if (f.kind === 'dropGram') {
    const i = S.gramConversions.findIndex(c => key(c.ingredient) === key(f.ingredient) && key(c.unit) === key(f.unit) && num(c.grams) === f.grams);
    if (i >= 0) S.gramConversions.splice(i, 1);
  } else if (f.kind === 'rename') {
    const from = new Set(f.from);
    const field = f.field;
    S.recipes.forEach(r => r.ingredients.forEach(i => { if (from.has(String(i[field] || '').trim())) i[field] = f.to; }));
    const cf = field === 'name' ? 'ingredient' : 'unit';
    [...S.gramConversions, ...S.bulkConversions].forEach(c => { if (from.has(String(c[cf] || '').trim())) c[cf] = f.to; });
    if (field === 'name') S.plan.forEach(p => { if (from.has(p.recipe)) p.recipe = f.to; });
  }
  commit(); toast('Updated');
}

function mountData() {
  const d = $('#drop'), f = $('#file');
  f.onchange = () => f.files[0] && readFile(f.files[0]);

}
function readFile(file) { const r = new FileReader(); r.onload = () => importText(String(r.result), file.name); r.readAsText(file); }
function importText(text, name = '') {
  text = text.trim();
  if (!text) return toast('Nothing to import');
  try {
    if (text[0] === '{' || text[0] === '[') {
      const data = JSON.parse(text);
      if (!Array.isArray(data) && data.id && (data.gram || data.bulk || data.renames || data.ingredientEdits)) {
        const done = applyPatch(S, data); commit(); return toast(done ? 'Update applied' : 'That update was already applied');
      }
      if (!Array.isArray(data) && Array.isArray(data.recipes) && Array.isArray(data.plan)) {
        const st = normalizeState(data);
        return modal(`<h3>Import full backup?</h3><p>${st.recipes.length} recipes, ${st.plan.length} planned, ${st.people.length} recipients, ${st.gramConversions.length + st.bulkConversions.length} conversions.</p>
          <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" data-x>Cancel</button><button class="btn" data-m>Only add its recipes</button><button class="btn primary" data-r>Replace everything</button></div>`, (m, close) => {
            m.querySelector('[data-x]').onclick = close;
            m.querySelector('[data-m]').onclick = () => { close(); mergeRecipes(st.recipes, st); };
            m.querySelector('[data-r]').onclick = () => { close(); S = st; commit(); toast('Backup restored'); };
          });
      }
      const recs = (Array.isArray(data) ? data : data.recipes ? data.recipes : [data]).map(normalizeRecipe);
      return mergeRecipes(recs);
    }
    return mergeRecipes(recipesFromCSV(text));
  } catch (e) { modal(`<h3>Couldn’t import${name ? ' ' + esc(name) : ''}</h3><p>${esc(e.message || e)}</p><div class="row" style="justify-content:flex-end"><button class="btn" data-x>OK</button></div>`, (m, c) => m.querySelector('[data-x]').onclick = c); }
}
function mergeRecipes(recs, from) {
  if (!recs.length) return toast('No recipes found');
  const dup = recs.filter(r => S.recipes.some(x => key(x.name) === key(r.name)));
  const go = mode => {
    let added = 0, replaced = 0;
    for (const r of recs) {
      const i = S.recipes.findIndex(x => key(x.name) === key(r.name));
      if (i < 0) { S.recipes.push(r); added++; }
      else if (mode === 'replace') { S.recipes[i] = r; replaced++; }
      else if (mode === 'copy') { let n = 2; while (S.recipes.some(x => key(x.name) === key(r.name + ' (' + n + ')'))) n++; S.recipes.push({ ...r, name: r.name + ' (' + n + ')' }); added++; }
    }
    // bring along missing conversions from a backup
    if (from) {
      for (const c of from.gramConversions) if (!S.gramConversions.some(x => key(x.ingredient) === key(c.ingredient) && key(x.unit) === key(c.unit))) S.gramConversions.push(c);
      for (const c of from.bulkConversions) if (!S.bulkConversions.some(x => key(x.ingredient) === key(c.ingredient) && key(x.unit) === key(c.unit))) S.bulkConversions.push(c);
    }
    commit(); toast(`${added} added${replaced ? ', ' + replaced + ' replaced' : ''}`);
    if (recs.length === 1) { ui.recipe = (S.recipes.find(x => key(x.name) === key(recs[0].name)) || recs[0]).name; location.hash = 'recipes'; render(); }
  };
  if (!dup.length) return go('skip');
  modal(`<h3>${dup.length} recipe${dup.length > 1 ? 's' : ''} already exist${dup.length > 1 ? '' : 's'}</h3><p class="small">${dup.map(d => esc(d.name)).join(', ')}</p><p>${recs.length - dup.length} new recipe(s) will be added either way.</p>
    <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" data-a="skip">Keep mine</button><button class="btn" data-a="copy">Add as copies</button><button class="btn primary" data-a="replace">Replace mine</button></div>`,
    (m, close) => m.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { close(); go(b.dataset.a); }));
}

    <div class="row" style="justify-content:flex-end"><button class="btn" data-x>Got it</button></div>`, (m, c) => m.querySelector('[data-x]').onclick = c);
  if (a === 'fillGrams') { let n = 0; rec().ingredients.forEach(i => { if (num(i.grams) == null) { const g = gramFor(S, i); if (g.grams != null) { i.grams = Math.round(g.grams * 10) / 10; n++; } } }); commit(); toast(n ? `Filled ${n} gram value${n > 1 ? 's' : ''}` : 'No matching conversions for the blanks'); }
  if (a === 'planAdd') { if (!S.plan.some(p => key(p.recipe) === key(d.name))) S.plan.push({ recipe: d.name, cookiesPerUnit: 6, bakeDay: '' }); commit(); toast('Added to plan with 6 cookies per unit'); }

  if (a === 'exportOne') { const r = rec(); d.fmt === 'csv' ? offerDownload(slug(r.name) + '.csv', recipesToCSV([r])) : offerDownload(slug(r.name) + '.json', JSON.stringify(r, null, 2)); }
  if (a === 'exportAll') offerDownload(`cookiepocalypse-backup-${today()}.json`, JSON.stringify(S, null, 1));

    offerDownload(`baking-cheat-sheet-${today()}.csv`, rows.join('\n'));
  }

document.addEventListener('change', e => {
  const t = e.target, d = t.dataset;
  const val = d.num != null ? num(t.value === '' ? null : +t.value) : t.value;
  if (t.id === 'addPlan' && t.value) { S.plan.push({ recipe: t.value, cookiesPerUnit: 6, bakeDay: '' }); return commit(); }
  if (d.plan != null) { const f = d.f; S.plan[+d.plan][f] = f === 'cookiesPerUnit' ? num(t.value === '' ? null : +t.value) : (t.value !== '' && isFinite(+t.value) ? +t.value : t.value); return commit(); }
  if (d.r != null) {
    const r = S.recipes[+d.r];
    if (d.f === 'name') {
      const nv = t.value.trim();
      if (!nv) { t.value = r.name; return toast('A recipe needs a name'); }
      if (S.recipes.some(x => x !== r && key(x.name) === key(nv))) { t.value = r.name; return toast('Another recipe already has that name'); }
      S.plan.forEach(p => { if (key(p.recipe) === key(r.name)) p.recipe = nv; });
      r.name = nv; ui.recipe = nv;
    } else r[d.f] = d.num != null ? val : t.value;
    return commit();
  }
  if (d.ing != null) {
    const r = S.recipes.find(x => key(x.name) === key(ui.recipe)); const i = r.ingredients[+d.ing];
    if (d.f === 'grams' && val == null) delete i.grams;
    else if (d.f === 'phase' && !t.value) delete i.phase;
    else i[d.f] = d.num != null ? (val ?? 0) : t.value.trim();
    if (d.f === 'grams' && val != null) syncIngredient(S, i, 'grams');
    if (d.f === 'amount' || d.f === 'unit' || (d.f === 'name' && num(i.grams) == null)) syncIngredient(S, i, 'measure');
    return commit();
  }
  if (d.p != null) { S.people[+d.p][d.f] = d.num != null ? (val ?? 0) : t.value; return commit(); }
  if (d.sub != null) { S.substitutions[+d.sub][d.f] = d.num != null ? val : t.value.trim(); return commit(); }
  if (t.id === 'kosherG') { S.kosherSaltGPerTsp = t.value === '' ? null : num(+t.value); return commit(); }

document.addEventListener('input', e => {

function pasteIngredients() {
  modal(`<h3>Paste ingredients</h3><p class="muted small">One per line: <code>amount unit ingredient</code> (e.g. <code>2.25 Cups Flour</code>), or tab/comma-separated <code>Ingredient, Amount, Unit, Grams, Phase</code> copied from a sheet.</p><textarea id="pi" style="min-height:180px"></textarea><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" data-x>Cancel</button><button class="btn primary" data-ok>Add</button></div>`, (m, close) => {
    m.querySelector('[data-x]').onclick = close;
    m.querySelector('[data-ok]').onclick = () => {
      const r = S.recipes.find(x => key(x.name) === key(ui.recipe));
      const units = allUnits().map(key);
      let n = 0;
      for (const line of m.querySelector('#pi').value.split(/\r?\n/)) {
        if (!line.trim()) continue;
        let ing;
        if (/[\t,]/.test(line)) {
          const c = parseCSV(line)[0].map(x => x.trim());
          if (key(c[0]) === 'name' || key(c[0]) === 'ingredient') continue;
          ing = { name: c[0], amount: num(+c[1]) ?? 0, unit: c[2] || '' };
          if (c[3] && isFinite(+c[3])) ing.grams = +c[3];
          if (c[4]) ing.phase = c[4];
        } else {
          const mm = line.trim().match(/^([\d.\/\s]+)\s+(\S+)\s+(.+)$/);
          if (mm) {
            const q = mm[1].trim().split(/\s+/).reduce((a, p) => a + (p.includes('/') ? (+p.split('/')[0] / +p.split('/')[1]) : +p), 0);
            ing = units.includes(key(mm[2])) ? { name: mm[3].trim(), amount: q, unit: mm[2] } : { name: (mm[2] + ' ' + mm[3]).trim(), amount: q, unit: 'Whole' };
          } else ing = { name: line.trim(), amount: 0, unit: '' };
        }
        r.ingredients = r.ingredients.filter(i => i.name);
        r.ingredients.push(ing); n++;
      }
      close(); commit(); toast(`Added ${n} ingredient${n === 1 ? '' : 's'}`);
    };
  });
}
